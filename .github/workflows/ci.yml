name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: constraints.txt
      - name: Install the pinned dependencies
        run: pip install -c constraints.txt -e ".[agent,dev]"
      - name: "Run the tests (no API key and no Docker needed; the model is a scripted stand-in)"
        run: python -m pytest -q

  images:
    name: docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the image the Kestra flows run (mend-ops)
        run: docker build -f orchestration/Dockerfile -t mend-ops:ci .
      - name: Build the slim Kestra image with the shell plugin
        run: docker build -t mend-kestra:ci orchestration/kestra
      - name: The image imports the package and the ops command runs
        run: docker run --rm mend-ops:ci mend-ops status --help
