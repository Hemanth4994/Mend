[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mend"
version = "0.1.0"
description = "Self-healing data pipelines: an agent that repairs schema drift, tested in a sandbox and scored against ground truth."
requires-python = ">=3.10"
dependencies = [
    "dlt[duckdb]>=1.20",
    "dbt-duckdb>=1.9",
    "duckdb>=1.1",
    "pyyaml>=6",
    "sqlglot>=25",
]

[project.optional-dependencies]
agent = ["langgraph>=0.2", "langchain-google-genai>=2.0", "langsmith>=0.1", "pydantic>=2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
